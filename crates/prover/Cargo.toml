[package]
name = "stwo-soroban-prover"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Generates Stwo proofs of the FibonacciSq statement in the format the Soroban verifier reads."

[[bin]]
name = "stwo-soroban-prover"
path = "src/main.rs"

[features]
keccak = ["stwo-soroban-air/keccak"]

[dependencies]
stwo = { workspace = true, features = ["prover"] }
stwo-constraint-framework = { workspace = true, features = ["prover"] }
stwo-soroban-air = { workspace = true, features = ["std"] }
postcard = { workspace = true, features = ["use-std"] }
serde_json = "1"
