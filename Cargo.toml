[workspace]
resolver = "2"
members = [
    "vendor/stwo",
    "vendor/stwo-constraint-framework",
    "crates/air",
    "crates/prover",
    "contracts/verifier",
    "contracts/demo",
    "contracts/recovery",
]

# Used by the vendored StarkWare crates (they inherit these values).
[workspace.package]
version = "2.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/starkware-libs/proving"

# Same pins as starkware-libs/proving@150a06b for everything the vendored crates use.
[workspace.dependencies]
bytemuck = { version = "1.20.0", default-features = false, features = ["derive"] }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
itertools = { version = "0.12.0", default-features = false, features = ["use_alloc"] }
num-traits = { version = "0.2.19", default-features = false }
rand = { version = "0.9.4", default-features = false, features = ["small_rng"] }
rayon = "1.10.0"
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
thiserror = { version = "2.0.12", default-features = false }
tracing = { version = "0.1.40", default-features = false }
tracing-subscriber = { version = "0.3.18", default-features = false }
blake2 = { version = "0.10.6", default-features = false }
blake3 = { version = "1.5.0", default-features = false }
sha3 = { version = "0.11.0", default-features = false, features = ["alloc"] }
educe = "0.5.0"
hashbrown = { version = ">=0.15.2", features = ["serde"] }
cfg-if = "1.0.0"
fnv = { version = "1.0.7", default-features = false }
stwo-std-shims = { version = "1.0.0", default-features = false }
dashmap = "6.0.1"
indexmap = { version = "2.10.0", default-features = false }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
stwo = { path = "vendor/stwo", default-features = false }
stwo-constraint-framework = { path = "vendor/stwo-constraint-framework", default-features = false }
stwo-soroban-air = { path = "crates/air" }

[profile.release]
opt-level = 3
debug = false

# Soroban contract build. "s" rather than "z": Soroban charges 67 fuel per Wasm call, so the
# extra inlining of "s" cuts verification cost about 2.5x, and the result still fits in 128 KiB.
[profile.contract]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false

# Variant measured on 2026-10-14: Keccak-256 through the host plus opt-level 3 for the Stwo crates.
# About 20 % cheaper to verify, 129,372 bytes (1.7 KB under the limit). Build it with
# KECCAK=1 ./scripts/build-contract.sh. The deployed contract is the default (Blake2s) build.
[profile.contract-keccak]
inherits = "contract"
[profile.contract-keccak.package.stwo]
opt-level = 3
[profile.contract-keccak.package.stwo-constraint-framework]
opt-level = 3
