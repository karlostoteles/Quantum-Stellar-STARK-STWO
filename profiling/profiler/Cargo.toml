[package]
name = "stwo-soroban-profiler"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Runs a Soroban contract under the host's metering and reports fuel by Wasm function."

[dependencies]
soroban-sdk = { version = "=29.0.1", features = ["testutils", "alloc"] }
soroban-wasmi = "=0.31.1-soroban.29.0.0"
wasmparser = "0.116"
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
