[package]
name = "stwo-soroban-air"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The statement, AIR and verification routine shared by the prover and the Soroban contract."

[features]
default = []
std = ["stwo/std", "stwo-constraint-framework/std"]
# Keccak-256 channel instead of Blake2s (Soroban has keccak256 as a host function).
keccak = []
# Verifier split into phases, for profiling (crates/air/src/probe.rs). Not for deployment.
probe = ["itertools", "stwo/probe"]
# Cheaper verifier, same results (see PATCHES.md, change 6).
fast = ["stwo/fast"]

[dependencies]
stwo = { workspace = true }
stwo-constraint-framework = { workspace = true }
serde = { workspace = true }
num-traits = { workspace = true }
itertools = { workspace = true, optional = true }
